# Headless Xorg for GPU_MODE=host. Binds Mesa iris/amdgpu/nouveau to
# /dev/dri/card0 even when no monitor is connected. Not used for viewing;
# the Android screen is still accessed via scrcpy / scrcpy-web.
Section "ServerFlags"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
    Option "kmsdev" "/dev/dri/card0"
    Option "SWcursor" "true"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 30-100
    VertRefresh 50-70
    Modeline "1280x720_60.00" 74.48 1280 1336 1472 1664 720 721 724 746 -HSync +Vsync
    Option "PreferredMode" "1280x720_60.00"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720"
        Virtual 1280 720
    EndSubSection
EndSection
