# Fork-only. Do not merge this workflow into the upstream PR.
# Daily: rebase `gpu` onto Shmayro/main. If that moves the branch, a push
# retriggers this file and publishes ghcr.io/<owner>/dockerify-android.
name: Sync upstream and publish GPU image

on:
  push:
    branches: [gpu]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: gpu-image
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/Shmayro/dockerify-android.git
  GPU_BRANCH: gpu

jobs:
  sync-upstream:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.rebase.outputs.changed }}
    steps:
      - name: Checkout gpu
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GPU_BRANCH }}
          fetch-depth: 0

      - name: Rebase onto upstream main
        id: rebase
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch origin "$GPU_BRANCH"
          git fetch upstream main
          before=$(git rev-parse HEAD)
          if ! git rebase upstream/main; then
            git rebase --abort || true
            echo "::error::Rebase onto Shmayro/main failed. Resolve GPU conflicts on the gpu branch."
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/main."
            exit 0
          fi
          git push --force-with-lease origin "$GPU_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Rebased $before -> $after and pushed $GPU_BRANCH."

  build:
    needs: sync-upstream
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        (needs.sync-upstream.result == 'success' &&
          (github.event_name == 'workflow_dispatch' || needs.sync-upstream.outputs.changed == 'true'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dockerify-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GPU_BRANCH }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: hub-login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          HUB_OK: ${{ steps.hub-login.outcome }}
          HUB_NS: ${{ github.repository_owner }}
        run: |
          sha="${GITHUB_SHA::7}"
          day="$(date -u +%Y%m%d)"
          image="$IMAGE_NAME"
          {
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:gpu"
            echo "${image}:sha-${sha}"
            echo "${image}:${day}"
            if [ "$HUB_OK" = "success" ]; then
              echo "${HUB_NS}/dockerify-android:latest"
              echo "${HUB_NS}/dockerify-android:gpu"
              echo "${HUB_NS}/dockerify-android:sha-${sha}"
              echo "${HUB_NS}/dockerify-android:${day}"
            else
              echo "::warning::Docker Hub login failed. Add repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=dockerify-android with optional host GPU (GPU_MODE=host)

      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${GITHUB_REPOSITORY##*/}"
          gh api --method PUT \
            "/user/packages/container/${pkg}/visibility" \
            -f visibility=public || true
